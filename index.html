<!DOCTYPE html>
<html>
    <head>
        <title>Currency Converter</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body id = "main-body">

        <div id = "main-container">
            <h1 id = "main-heading"></h1>

            <div id = "converter-container">
                <div id = "input-container"></div>

                <div id = "dropdown-section">
                    <div id = "initial-currency-dropdown">
                        <button id = "initial-dropdown-button"></button>
                        <div id = "initial-currency-options"></div>
                    </div>

                    <div id = "converted-currency-dropdown">
                        <button id = "converted-dropdown-button"></button>
                        <div id = "converted-currency-options"></div>
                    </div>
                </div>

                <button id = "conversion-button"></button>
            </div>
            
            <div id = "output-container"></div>
        </div>

        <script src = "CurrencyConverter.js"></script>
    </body>
</html>
